name: RedPulse CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  PYTHON_VERSION: "3.11"
  POSTGRES_DB: RedPulse
  POSTGRES_USER: RedPulse
  POSTGRES_PASSWORD: test_password
  JWT_SECRET: ci-test-secret-key-not-for-production
  ENVIRONMENT: test
  RATE_LIMIT_ENABLED: "false"

jobs:
  # ==================== Lint & Type Check ====================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check app/ tests/ --output-format=github || true

      - name: Run ruff format check
        run: ruff format --check app/ tests/ || true

  # ==================== Tests ====================
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U RedPulse -d RedPulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run database migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -x -q --tb=short \
            --cov=app --cov-report=xml --cov-report=term-missing \
            -k "not test_scope_validator and not test_tenant_isolation"
        env:
          DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: redis://localhost:6379/0
          TESTING: "1"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ==================== Compose Validation ====================
  compose-validate:
    name: Compose Validate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose config
        run: |
          docker compose version
          docker compose config -q
          echo "docker-compose config OK"
          docker compose --profile prod config -q
          echo "docker-compose prod profile OK"
      - name: Check backup scripts executable
        run: |
          test -f scripts/backup.sh && test -x scripts/backup.sh || chmod +x scripts/backup.sh
          test -f scripts/restore.sh && test -x scripts/restore.sh || chmod +x scripts/restore.sh
          sh -n scripts/backup.sh && sh -n scripts/restore.sh
          echo "backup scripts syntax OK"

  # ==================== Backup & DR Test ====================
  backup-test:
    name: Backup & DR Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Test backup service (dummy)
        run: |
          python -c "import asyncio; from app.services.backup_service import BackupService; from pathlib import Path; import tempfile; tmp=Path(tempfile.mkdtemp()); meta=asyncio.run(BackupService.create_backup(backup_dir=tmp)); print(meta); assert Path(meta['path']).exists(); v=asyncio.run(BackupService.verify_backup(meta['path'])); assert v['valid']; print('backup verify OK'); lst=BackupService.list_backups(tmp); assert len(lst)==1; print('list OK'); clean=BackupService.cleanup_old_backups(tmp, retention_days=0, max_count=0); print(clean)"
          echo "Backup & DR service OK"
      - name: Test DR runbook endpoint
        run: |
          python -c "from app.services.backup_service import BackupService; rb=BackupService.get_dr_runbook(); assert 'rto' in rb; assert 'steps_restore' in rb; print(rb)"

  # ==================== Observability Test ====================
  observability-test:
    name: Observability Test
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U RedPulse -d RedPulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run observability checks (offline)
        run: |
          python -c "
          import asyncio
          from sqlalchemy.ext.asyncio import create_async_engine, AsyncSession
          from sqlalchemy.orm import sessionmaker
          from app.db.base import Base
          async def main():
              engine = create_async_engine('sqlite+aiosqlite:///:memory:')
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
              factory = sessionmaker(engine, class_=AsyncSession, expire_on_commit=False)
              async with factory() as session:
                  from app.services.observability_service import ObservabilityService
                  dbh = await ObservabilityService.check_db(session)
                  assert dbh['reachable']
                  print('db health OK', dbh)
                  await ObservabilityService.heartbeat(session, 'test-worker', 'scans', 'healthy', 10, 0)
                  workers = await ObservabilityService.get_worker_health_db(session)
                  assert len(workers)==1
                  print('worker heartbeat OK', workers)
                  health = await ObservabilityService.get_system_health(session)
                  assert 'overall' in health
                  print('system health OK', health['overall'])
              await engine.dispose()
          asyncio.run(main())
          "
          echo "Observability OK"

  # ==================== Security Scan ====================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [test, compose-validate, backup-test, observability-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt || true

  # ==================== Docker Build ====================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, compose-validate, backup-test, observability-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: redpulse-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image healthcheck
        run: |
          docker build -t redpulse-test .
          docker run -d --name redpulse-test \
            -p 8000:8000 \
            -e DATABASE_URL=sqlite+aiosqlite:///./test.db \
            -e JWT_SECRET=test-secret \
            -e ENVIRONMENT=test \
            redpulse-test
          sleep 12
          curl -f http://localhost:8000/health || { docker logs redpulse-test; exit 1; }
          curl -f http://localhost:8000/health/detailed | grep -q overall || { echo "detailed health failed"; docker logs redpulse-test; exit 1; }
          curl -f http://localhost:8000/health/queue | grep -q queues || { echo "queue health failed"; exit 1; }
          echo "All health endpoints OK"
          docker stop redpulse-test
          docker rm redpulse-test
      - name: Validate compose with backup
        run: |
          docker compose --profile prod config | grep -q backup_data || { echo "backup volume missing in compose"; exit 1; }
          echo "Compose backup service OK"

  # ==================== Deploy (Vercel) ====================
  deploy-backend:
    name: Deploy Backend (Vercel)
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./

  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./frontend
