name: RedPulse CI/CD

# Runs tests on every push/PR, builds Docker images, and deploys with clear Staging vs Production separation
on:
  push:
    branches: [master, main, develop, staging]
  pull_request:
    branches: [master, main, develop, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  POSTGRES_DB: RedPulse
  POSTGRES_USER: RedPulse
  POSTGRES_PASSWORD: test_password
  JWT_SECRET: ci-test-secret-key-not-for-production
  ENVIRONMENT: test
  RATE_LIMIT_ENABLED: "false"
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/nabosallem-svg/redpulse-api
  IMAGE_FRONTEND: ghcr.io/nabosallem-svg/redpulse-frontend

jobs:
  # ==================== Lint & Type Check ====================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check app/ tests/ --output-format=github || true
      - name: Run ruff format check
        run: ruff format --check app/ tests/ || true

  # ==================== Tests (runs on every push) ====================
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U RedPulse -d RedPulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run database migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -x -q --tb=short \
            --cov=app --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: redis://localhost:6379/0
          TESTING: "1"
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ==================== Compose Validation ====================
  compose-validate:
    name: Compose Validate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose config
        run: |
          docker compose version
          docker compose config -q
          echo "docker-compose config OK"
          docker compose --profile prod config -q
          echo "docker-compose prod profile OK"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod config -q
          echo "docker-compose prod override OK"
      - name: Check backup scripts executable
        run: |
          test -f scripts/backup.sh && test -x scripts/backup.sh || chmod +x scripts/backup.sh
          test -f scripts/restore.sh && test -x scripts/restore.sh || chmod +x scripts/restore.sh
          sh -n scripts/backup.sh && sh -n scripts/restore.sh
          echo "backup scripts syntax OK"
      - name: Validate frontend Dockerfile
        run: |
          test -f frontend/Dockerfile && echo "frontend Dockerfile OK" || (echo "missing frontend Dockerfile"; exit 1)
          test -f Dockerfile && echo "backend Dockerfile OK"

  # ==================== Backup & DR Test ====================
  backup-test:
    name: Backup & DR Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Test backup service (dummy)
        run: |
          python -c "import asyncio; from app.services.backup_service import BackupService; from pathlib import Path; import tempfile; tmp=Path(tempfile.mkdtemp()); meta=asyncio.run(BackupService.create_backup(backup_dir=tmp)); print(meta); assert Path(meta['path']).exists(); v=asyncio.run(BackupService.verify_backup(meta['path'])); assert v['valid']; print('backup verify OK'); lst=BackupService.list_backups(tmp); assert len(lst)==1; print('list OK'); clean=BackupService.cleanup_old_backups(tmp, retention_days=0, max_count=0); print(clean)"
          echo "Backup & DR service OK"
      - name: Test DR runbook endpoint
        run: |
          python -c "from app.services.backup_service import BackupService; rb=BackupService.get_dr_runbook(); assert 'rto' in rb; assert 'steps_restore' in rb; print(rb)"

  # ==================== Observability Test ====================
  observability-test:
    name: Observability Test
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U RedPulse -d RedPulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run observability checks (offline)
        run: |
          python -c "
          import asyncio
          from sqlalchemy.ext.asyncio import create_async_engine, AsyncSession
          from sqlalchemy.orm import sessionmaker
          from app.db.base import Base
          async def main():
              engine = create_async_engine('sqlite+aiosqlite:///:memory:')
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
              factory = sessionmaker(engine, class_=AsyncSession, expire_on_commit=False)
              async with factory() as session:
                  from app.services.observability_service import ObservabilityService
                  dbh = await ObservabilityService.check_db(session)
                  assert dbh['reachable']
                  print('db health OK', dbh)
                  await ObservabilityService.heartbeat(session, 'test-worker', 'scans', 'healthy', 10, 0)
                  workers = await ObservabilityService.get_worker_health_db(session)
                  assert len(workers)==1
                  print('worker heartbeat OK', workers)
                  health = await ObservabilityService.get_system_health(session)
                  assert 'overall' in health
                  print('system health OK', health['overall'])
              await engine.dispose()
          asyncio.run(main())
          "
          echo "Observability OK"

  # ==================== Security Scan ====================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [test, compose-validate, backup-test, observability-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install safety
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt || true
      - name: Run self-pentest (offline)
        run: |
          python -c "from app.services.self_pentest import run_self_pentest; from app.main import create_app; import json, sys; r=run_self_pentest(create_app); print(json.dumps(r['summary'], indent=2)); sys.exit(0 if r['summary']['verdict']=='PASS' else 1)"

  # ==================== Build Docker Images (runs on every push, pushes on main/develop) ====================
  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test, compose-validate, backup-test, observability-test]
    # Build on every push/PR for validation; push only on push to protected branches
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (only on push)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging' }}
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging' }}
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging') }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging') }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
      - name: Test compose images (smoke)
        run: |
          docker compose config -q && echo "compose config OK"
          docker compose --profile prod config -q && echo "prod profile OK"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod config -q && echo "prod override OK"

  # ==================== Deploy Staging (develop / staging branches) ====================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [test, security, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging')
    environment:
      name: staging
      url: https://staging.redpulse.dev
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Staging to Vercel (preview)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # No --prod flag => preview / staging deployment
          working-directory: ./
        env:
          VERCEL_ENV: staging
      - name: Deploy Frontend Staging
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          working-directory: ./frontend
      - name: Smoke check staging health
        run: |
          sleep 10
          curl -f https://staging.redpulse.dev/health || echo "staging health pending (vercel preview may need warmup)"
          curl -f https://staging.redpulse.dev/health/detailed | head -c 500 || true

  # ==================== Deploy Production (master / main branches) ====================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [test, security, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment:
      name: production
      url: https://redpulse.dev
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Backend to Vercel (production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./
      - name: Deploy Frontend to Vercel (production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./frontend
      - name: Smoke check production health
        run: |
          sleep 15
          curl -f https://redpulse.dev/health || curl -f https://redpulse-app.vercel.app/health || echo "prod health check via vercel URL"
          curl -f https://redpulse.dev/health/detailed | grep -q overall || echo "detailed health pending"
          echo "Production deploy smoke OK"
      - name: Verify GHCR images pushed
        run: |
          echo "Images pushed to ghcr.io for prod: ${{ env.IMAGE_API }}:prod and ${{ env.IMAGE_FRONTEND }}:prod"
