# RedPulse - Docker Compose (Production + Development)
# Usage:
#   Development: docker compose up
#   Production:  docker compose --profile prod up -d
#   Worker only: docker compose up -d worker

services:
  # ==================== Infrastructure ====================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-RedPulse}
      POSTGRES_USER: ${POSTGRES_USER:-RedPulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-RedPulse} -d ${POSTGRES_DB:-RedPulse}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== Application ====================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: redpulse-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://RedPulse:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-RedPulse}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:3000"]}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-60/minute}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NUCLEI_BIN: ${NUCLEI_BIN:-/usr/local/bin/nuclei}
      SUBFINDER_BIN: ${SUBFINDER_BIN:-/usr/local/bin/subfinder}
      HTTPX_BIN: ${HTTPX_BIN:-/usr/local/bin/httpx}
      SCANNER_TIMEOUT: ${SCANNER_TIMEOUT:-60}
      SCANNER_MAX_WORKERS: ${SCANNER_MAX_WORKERS:-4}
    ports:
      - "${API_PORT:-8000}:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2} --proxy-headers --forwarded-allow-ips '*'"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ==================== Frontend (Next.js) ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_ vars are baked at Next.js build time — pass via build arg for dynamic per-env (local vs prod)
        # Local: http://localhost:8000 (default), Prod: https://redpulse.dev or Vercel URL via .env / CI build arg
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: redpulse-frontend:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Runtime fallback (for non-NEXT_PUBLIC vars); NEXT_PUBLIC_API_URL is already baked at build, but keep for logs
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Frontend is prod-only via Vercel by default; enable via --profile prod if you want it in compose
    profiles: ["prod"]

  # ==================== Background Worker ====================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: redpulse-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://RedPulse:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-RedPulse}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      NUCLEI_BIN: ${NUCLEI_BIN:-/usr/local/bin/nuclei}
      SUBFINDER_BIN: ${SUBFINDER_BIN:-/usr/local/bin/subfinder}
      HTTPX_BIN: ${HTTPX_BIN:-/usr/local/bin/httpx}
    command: ["sh", "-c", "alembic upgrade head && celery -A app.services.celery_app worker -l info -c ${WORKER_CONCURRENCY:-2} -Q scans,default"]
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ==================== Celery Beat (Periodic Tasks) ====================
  beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: redpulse-api:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    command: ["celery", "-A", "app.services.celery_app", "beat", "-l", "info", "--pidfile", "/tmp/celerybeat.pid"]
    profiles: ["prod"]
    deploy:
      resources:
        limits:
          memory: 256M

  # ==================== Flower (Celery Monitor) ====================
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: redpulse-api:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    command: ["celery", "-A", "app.services.celery_app", "flower", "--port=5555", "--broker_api=redis://redis:6379/1"]
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    profiles: ["prod"]
    deploy:
      resources:
        limits:
          memory: 256M

  # ==================== Backup & Disaster Recovery ====================
  backup:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: redpulse-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://RedPulse:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-RedPulse}}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_MAX_COUNT: ${BACKUP_MAX_COUNT:-10}
      # Optional S3: BACKUP_S3_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
    volumes:
      - backup_data:/backups
      - ./scripts:/app/scripts:ro
    command: >
      sh -c "mkdir -p /backups && echo 'Backup service started - daily 02:00 UTC' &&
             while true; do
               python -c \"import asyncio; from app.services.backup_service import BackupService; asyncio.run(BackupService.create_backup()); print(BackupService.cleanup_old_backups())\" || echo 'Backup failed';
               sleep 86400;
             done"
    healthcheck:
      test: ["CMD-SHELL", "ls -t /backups/*.sql.gz | head -1 | xargs test -f && find /backups -name '*.sql.gz' -mtime -2 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["prod"]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backup_data:
    driver: local

networks:
  default:
    name: redpulse-net
